name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_RELEASE_ID: ${{ github.run_id }}
          VITE_DEPLOY_TIME: ${{ github.event.head_commit.timestamp }}
          VITE_TEAM_NAME: ${{ vars.TEAM_NAME || secrets.TEAM_NAME || 'Kraken' }}
          VITE_BRANCH: ${{ github.ref_name }}
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL || secrets.IP_PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.DOMAIN_PUBLIC_URL || '' }}
        run: npm run build
        working-directory: team-site

      - name: Write health and status evidence
        env:
          TEAM_NAME: ${{ vars.TEAM_NAME || 'KRAKEN' }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.IP_PUBLIC_URL || '' }}
        run: |
          rm -rf team-site/dist/health team-site/dist/status
          mkdir -p team-site/dist/health team-site/dist/status
          printf 'ok' > team-site/dist/health/index.html
          printf '{"team":"%s","task":"T01","commitSha":"%s","releaseId":"%s","deployTime":"%s","publicUrl":"%s","branch":"%s","weather":{"provider":"openweather","city":"Colombo","keyExposed":false}}' \
            "$TEAM_NAME" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$PUBLIC_URL" \
            "$GITHUB_REF_NAME" \
            > team-site/dist/status/index.html

      - name: Fetch weather data (server-side only)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: ${{ vars.OPENWEATHER_CITY || 'Colombo' }}
        run: |
          set -euo pipefail
          mkdir -p team-site/dist/api

          if [ -z "${OPENWEATHER_API_KEY:-}" ]; then
            echo "OPENWEATHER_API_KEY not set — writing stub response"
            printf '{"task":"T07","provider":"openweather","city":"%s","keyExposed":false,"temperature":30,"description":"clear sky","humidity":70,"windSpeed":3.5,"stub":true}' \
              "$OPENWEATHER_CITY" > team-site/dist/api/weather
          else
            WEATHER_JSON=$(curl -sf \
              "https://api.openweathermap.org/data/2.5/weather?q=${OPENWEATHER_CITY}&appid=${OPENWEATHER_API_KEY}&units=metric" || echo "")

            if [ -z "$WEATHER_JSON" ]; then
              echo "OpenWeather API call failed — writing stub"
              printf '{"task":"T07","provider":"openweather","city":"%s","keyExposed":false,"temperature":30,"description":"clear sky","humidity":70,"windSpeed":3.5,"stub":true}' \
                "$OPENWEATHER_CITY" > team-site/dist/api/weather
            else
              TEMP=$(echo "$WEATHER_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['main']['temp'])")
              DESC=$(echo "$WEATHER_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['weather'][0]['description'])")
              HUM=$(echo "$WEATHER_JSON"  | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['main']['humidity'])")
              WIND=$(echo "$WEATHER_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['wind']['speed'])")
              printf '{"task":"T07","provider":"openweather","city":"%s","keyExposed":false,"temperature":%s,"description":"%s","humidity":%s,"windSpeed":%s}' \
                "$OPENWEATHER_CITY" "$TEMP" "$DESC" "$HUM" "$WIND" \
                > team-site/dist/api/weather
            fi
          fi

      - name: Write config status evidence (T05)
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || '' }}
        run: node scripts/generate-config-status.mjs
        working-directory: team-site

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

  deploy-dry-run:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: ./release-candidate

      - name: Record artifact identity
        run: |
          printf '{"task":"T03","artifact":"site-dist-%s"}' "$GITHUB_SHA" > release-candidate/artifact.json
