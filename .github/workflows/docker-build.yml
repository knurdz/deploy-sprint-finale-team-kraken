name: Docker Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t deploy-sprint/kraken:${{ github.sha }} team-site

      - name: Record image evidence
        run: |
          {
            echo "## T14 Docker Build"
            echo ""
            echo "- Image: deploy-sprint/kraken:${{ github.sha }}"
            echo "- Digest: $(docker image inspect deploy-sprint/kraken:${{ github.sha }} --format '{{.Id}}')"
          } >> "$GITHUB_STEP_SUMMARY"
