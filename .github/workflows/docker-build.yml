name: Docker Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build -t deploy-sprint/team-site:$GITHUB_SHA team-site

      - name: Record image evidence
        run: |
          {
            echo "## T18 Containerized VPS Deploy Evidence"
            echo ""
            echo "- Image: deploy-sprint/team-site:${{ github.sha }}"
            echo "- Digest: $(docker image inspect deploy-sprint/team-site:${{ github.sha }} --format '{{.Id}}')"
          } >> "$GITHUB_STEP_SUMMARY"

