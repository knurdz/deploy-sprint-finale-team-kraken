name: Rollback

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Known-good tag, SHA, or artifact id to redeploy"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve rollback target
        run: |
          echo "T04 rollback requested"
          test -n "${{ inputs.release_ref }}"
          echo "Resolved release_ref: ${{ inputs.release_ref }}"

      - name: Checkout known-good ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Record rollback evidence
        run: |
          {
            echo "## Rollback Summary"
            echo "- Requested release_ref: \`${{ inputs.release_ref }}\`"
            echo "- Resolved commit SHA: \`$(git rev-parse HEAD)\`"
            echo "- Triggered by: ${{ github.actor }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # If there's a real deploy step (script, action, artifact download),
      # it goes here — using the checked-out ref as the source.