# Nginx site configuration for Team Kraken static site
# Deploy path: /opt/deploy-sprint/kraken
# Apply with: ln -s this file to /etc/nginx/sites-enabled/

server {
    listen 8080;
    server_name _;

    root /opt/deploy-sprint/kraken;
    index index.html;

    # /health - plain text, always 200
    location = /health {
        default_type text/plain;
        try_files /health =404;
        add_header Cache-Control "no-cache";
    }

    # /status - JSON, always 200
    location = /status {
        default_type application/json;
        try_files /status =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
